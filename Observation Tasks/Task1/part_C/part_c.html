    <!-- ================= PART C ================= -->

    <section id="registration">

        <h2>Student Registration Form</h2>

        <form>

            <label><strong>Student Name</strong></label><br>
            <input type="text" placeholder="Enter your name" required>

            <br><br>

            <label><strong>Email Address</strong></label><br>
            <input type="email" placeholder="Enter your email" required>

            <br><br>

            <label><strong>Password</strong></label><br>
            <input type="password" placeholder="Enter password" required>

            <br><br>

            <label><strong>Gender</strong></label><br>

            <input type="radio" name="gender"> Male

            <input type="radio" name="gender"> Female

            <input type="radio" name="gender"> Other

            <br><br>

            <label><strong>Hobbies</strong></label><br>

            <input type="checkbox"> Reading

            <input type="checkbox"> Coding

            <input type="checkbox"> Sports

            <input type="checkbox"> Music

            <br><br>

            <label><strong>Branch</strong></label><br>

            <select>

                <option>Select Branch</option>

                <option>Computer Science and Engineering</option>

                <option>Computer Science and Machine Learning</option>

                <option>Artificial Intelligence & Machine Learning</option>

                <option>Electronics and Communication Engineering</option>

                <option>Electrical and Electronics Engineering</option>

            </select>

            <br><br>

            <label><strong>Comments</strong></label><br>

            <textarea rows="5" cols="50"
                placeholder="Enter your comments"></textarea>

            <br><br>

            <input type="submit" value="Submit">

            <input type="reset" value="Reset">

        </form>

    </section>

    <hr>
