<!DOCTYPE html>
<html>

<head>
    <title>My To-Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f2f4f8;
            text-align: center;
            margin-top: 50px;
        }

        h1 {
            color: #333333;
        }

        .input-section {
            margin: 20px;
        }

        input {
            padding: 10px;
            width: 250px;
            border: 1px solid #cccccc;
            border-radius: 5px;
        }

        #addTask {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #addTask:hover {
            background-color: #45a049;
        }

        #emptyMessage {
            color: #777777;
        }

        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            background-color: white;
            margin: 10px auto;
            padding: 10px;
            width: 400px;
            border-radius: 5px;
            box-shadow: 0 2px 5px #cccccc;
        }

        .complete {
            margin-left: 15px;
            padding: 5px 10px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .delete {
            margin-left: 5px;
            padding: 5px 10px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .complete:hover {
            background-color: #1976D2;
        }

        .delete:hover {
            background-color: #d32f2f;
        }

        /* Completed task */
        .completed {
            text-decoration: line-through;
            color: #888888;
        }
    </style>
</head>

<body>

    <h1>My To-Do List</h1>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter a task">
        <button id="addTask">Add Task</button>
    </div>

    <p id="emptyMessage">No tasks available.</p>

    <ul id="taskList"></ul>

    <script src="Script.js"></script>

</body>

</html>
