<!DOCTYPE html>
<html lang="en">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        .box-example {
            /* 1. THE LAYOUT CONTENT LAYER */
            width: 300px;
            height: 200px;
            background-color: #3498db;
            /* Blue background behind the text */
            color: white;


            /* 2. THE PADDING LAYER (Space INSIDE the box, around the text) */
            padding: 20px;


            /* 3. THE BORDER LAYER (The frame wrapping the padding & content) */
            border: 5px solid #2c3e50;
            /* Dark gray border line */


            /* 4. THE MARGIN LAYER (Space OUTSIDE the box, pushing other things away) */
            margin: 40px;


            /* Best Practice: Forces padding/borders inside the 300px width */
            box-sizing: border-box;
        }
    </style>
</head>


<body>
    <div class="box-example">
        <h3>Example</h3>
        <p>Hello, I am the text content inside this box model example!</p>
    </div>
</body>


</html>
